apiVersion: apps/v1
kind: Deployment
metadata:
  name: fieldledger-gateway
  namespace: fieldledger
  labels:
    app.kubernetes.io/name: fieldledger-gateway
    app.kubernetes.io/part-of: fieldledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fieldledger-gateway
  template:
    metadata:
      labels:
        app: fieldledger-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/garbox0/fieldledger-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: INTERNAL_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fieldledger-secrets
                  key: INTERNAL_GATEWAY_TOKEN
            - name: FABRIC_CHANNEL_NAME
              value: "fieldledgerchannel"
            - name: FABRIC_CHAINCODE_NAME
              value: "fieldledger"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: fieldledger
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: fieldledger
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: fieldledger-gateway
  type: ClusterIP
