apiVersion: apps/v1
kind: Deployment
metadata:
  name: fieldledger-api
  namespace: fieldledger
  labels:
    app.kubernetes.io/name: fieldledger-api
    app.kubernetes.io/part-of: fieldledger
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fieldledger-api
  template:
    metadata:
      labels:
        app: fieldledger-api
    spec:
      serviceAccountName: fieldledger-api-sa
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres..."
              until nc -z -v -w3 postgres-service.fieldledger.svc.cluster.local 5432; do
                echo "PostgreSQL is unavailable - sleeping..."
                sleep 2
              done
              echo "PostgreSQL is up!"
      containers:
        - name: api
          image: ghcr.io/garbox0/fieldledger-api:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: fieldledger-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fieldledger-secrets
                  key: JWT_SECRET
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fieldledger-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fieldledger-secrets
                  key: MINIO_SECRET_KEY
            - name: INTERNAL_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fieldledger-secrets
                  key: INTERNAL_GATEWAY_TOKEN
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: fieldledger
  labels:
    app.kubernetes.io/name: api-service
    app.kubernetes.io/part-of: fieldledger
spec:
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app: fieldledger-api
  type: ClusterIP
